name: Cross-chain tool matrix

# Manually-dispatched proof run: buy the top-N external tools on EACH of the
# seven rails and print a tools×chains grid of real on-chain settlements. Proves
# every top tool renders its payload through every chain (settlement → unlock →
# payload), with a tx receipt per cell. Not scheduled — it spends real money
# (~$3-5 for the full 15×7 grid), so it runs only when dispatched. Informational:
# the grid is the job-log output; it never opens an issue or pages.
on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "How many top tools to test (rows)"
        required: false
        default: "15"
      dry_run:
        description: "Dry run (no payments — just verify every chain is offered)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BURNER_KEY: ${{ secrets.BURNER_KEY }}
      SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
      STELLAR_BURNER_SECRET: ${{ secrets.STELLAR_BURNER_SECRET }}
      ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
      # Marks every buy with X-Heartbeat-Token so the matrix records as internal
      # traffic (synthetic), not external demand, in the sales ledger + PostHog.
      POW_SECRET: ${{ secrets.POW_SECRET }}
      TARGET_URL: https://agent402.tools
      MATRIX_TOP_N: ${{ github.event.inputs.top_n }}
      MATRIX_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install x402 client SDKs
        # Same pinned set as scripts/paid-canary.js: @x402/* matched to the
        # server's protocol version (src/payments.js runs 2.16); @x402/avm +
        # algosdk come from package.json via `npm ci`. Version skew is a known
        # cause of SVM/AVM settle failures — keep this in lockstep with the canary.
        run: npm ci && npm install --no-save --ignore-scripts @x402/fetch@2.16.0 @x402/core@2.16.0 @x402/evm@2.16.0 @x402/svm@2.16.0 @x402/stellar@2.17.0 @stellar/stellar-sdk @solana/kit viem
      - name: Run the cross-chain tool matrix
        run: |
          if [ -z "$BURNER_KEY" ] && [ "$MATRIX_DRY_RUN" != "1" ]; then
            echo "No BURNER_KEY secret — cannot run the paid grid. Re-run with dry_run=true for a plumbing check."
            exit 1
          fi
          [ -n "$BURNER_KEY" ] && echo "::add-mask::$BURNER_KEY"
          [ -n "$SOLANA_BURNER_KEY" ] && echo "::add-mask::$SOLANA_BURNER_KEY"
          [ -n "$STELLAR_BURNER_SECRET" ] && echo "::add-mask::$STELLAR_BURNER_SECRET"
          [ -n "$ALGORAND_BURNER_MNEMONIC" ] && echo "::add-mask::$ALGORAND_BURNER_MNEMONIC"
          node scripts/cross-chain-matrix.js
