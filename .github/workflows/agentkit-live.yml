name: AgentKit adapter live proof

# Proves agent402-agentkit with a REAL AgentKit wallet provider against
# production: ViemWalletProvider over the canary burner pays a wallet-only tool
# ($0.002) over x402 through agent402_call. Installs @coinbase/agentkit from the
# registry (its real dependency tree, ~minutes) in a scratch dir with no secrets
# beyond the burner key. Dispatch-only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install AgentKit + the adapter into a scratch dir
        run: |
          # Pack the adapter from the checkout and install the tarball: a folder
          # install is a symlink, and a symlinked package resolves its own
          # dependencies (agent402-client) from the checkout, not the scratch dir.
          TGZ=$(cd "$GITHUB_WORKSPACE/adapters/agentkit" && npm pack --silent | tail -1)
          mkdir -p /tmp/akproof && cd /tmp/akproof && npm init -y >/dev/null
          npm i --no-audit --no-fund --ignore-scripts @coinbase/agentkit@0.10.4 viem "$GITHUB_WORKSPACE/adapters/agentkit/$TGZ" @x402/fetch @x402/evm zod
          cp "$GITHUB_WORKSPACE/scripts/agentkit-live.js" .
      - name: Drive agent402_find + agent402_call with a real wallet provider
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          AGENTKIT_ADAPTER: agent402-agentkit
        run: |
          [ -n "$BURNER_KEY" ] || { echo "::error::BURNER_KEY secret missing"; exit 1; }
          echo "::add-mask::$BURNER_KEY"; [ -n "$POW_SECRET" ] && echo "::add-mask::$POW_SECRET"
          cd /tmp/akproof && node agentkit-live.js
