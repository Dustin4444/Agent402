name: OpenRouter TTS model probe

# One-shot diagnostic (workflow_dispatch only): the /v1/audio/speech tier
# needs OpenRouter's LIVE TTS model ids — their docs and skill examples have
# gone stale (2026-07-09: both the undated alias and the documented dated
# snapshot were rejected with "Model does not exist"). GitHub runners are the
# egress path the dev sandbox doesn't have. Read-only against the public
# models API; the optional authenticated leg buys NOTHING (a rejected model id
# costs $0 — it errors before generation).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TTS/audio ids in the public models list
        run: |
          curl -sS --max-time 30 https://openrouter.ai/api/v1/models -o /tmp/models.json
          echo "total models: $(jq '.data | length' /tmp/models.json)"
          echo "--- ids matching tts/speech/voxtral/chirp/audio:"
          jq -r '.data[].id' /tmp/models.json | grep -iE 'tts|speech|voxtral|chirp|audio' || echo "(none in /api/v1/models)"
          echo "--- output_modalities containing audio:"
          jq -r '.data[] | select(.architecture.output_modalities != null and (.architecture.output_modalities | index("audio"))) | .id' /tmp/models.json || true

      - name: Authenticated probe of /v1/audio/speech (skips without secret)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || { echo "no OPENROUTER_API_KEY secret — skipping the endpoint probe"; exit 0; }
          for M in "openai/gpt-4o-mini-tts" "openai/gpt-4o-mini-tts-2025-12-15" "openai/gpt-4o-mini-tts-2026-06-01" "mistralai/voxtral-mini-tts-2603" "google/gemini-2.5-flash-tts"; do
            CODE=$(curl -sS --max-time 30 -o /tmp/tts-probe.out -w '%{http_code}' \
              -X POST https://openrouter.ai/api/v1/audio/speech \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"input\":\"ping\",\"voice\":\"alloy\",\"response_format\":\"mp3\"}")
            SIZE=$(wc -c < /tmp/tts-probe.out)
            if [ "$CODE" = "200" ]; then
              echo "PROBE $M → 200 (${SIZE} bytes of audio) ✅"
            else
              echo "PROBE $M → $CODE $(head -c 200 /tmp/tts-probe.out)"
            fi
          done
