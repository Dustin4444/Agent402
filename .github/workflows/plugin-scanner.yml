name: Plugin security scan
# The plugin scanner registries use to grade this repository (HOL). Advisory:
# it reports findings and never blocks a merge. Repository config
# (.plugin-scanner.toml) is honoured so test fixtures are excluded the same
# way the registry reads them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashgraph-online/ai-plugin-scanner-action@ff72bdc87402c9751fe9be6977de41c0cfcc514b # v1.2.706
        with:
          plugin_dir: "."
          trust_repository_policy: "true"
          min_score: "0"
          fail_on_severity: "none"
