name: Solana refund send (one-time)

# Sends an SPL USDC refund on Solana, which scripts/refund-run.js cannot do:
# senders.solana is hardcoded false there (no SVM spending wallet), so debts on
# that chain are recorded and HELD. This pays one deliberately.
#
# Uses the CI canary burner, the same wallet that already pays on Solana daily.
# Dispatch-only and DRY by default: `send: true` is the only thing that
# broadcasts. Every guard refuses rather than guesses - the destination must
# already hold a USDC account, the amount is bounded by `max_usd`, and the
# burner must cover the amount plus a fee reserve.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Destination Solana address (the payer being refunded)"
        required: true
      usd:
        description: "USDC to send, e.g. 1.60"
        required: true
      max_usd:
        description: "Hard ceiling for this run"
        required: false
        default: "5"
      send:
        description: "Actually broadcast (false = dry run, just checks)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency: solana-refund-send

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: "22"
      - name: Install the Solana client
        run: npm install --no-save --ignore-scripts @solana/kit @solana-program/token
      - name: Send
        env:
          SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
          TO: ${{ inputs.to }}
          USD: ${{ inputs.usd }}
          MAX: ${{ inputs.max_usd }}
        run: |
          if [ -z "$SOLANA_BURNER_KEY" ]; then echo "SOLANA_BURNER_KEY is not set"; exit 1; fi
          echo "::add-mask::$SOLANA_BURNER_KEY"
          # Inputs ride as env vars and are passed as argv, never interpolated
          # into the shell line (N-03).
          node scripts/solana-refund-send.js --to "$TO" --usd "$USD" --max "$MAX" ${{ inputs.send && '--send' || '' }}
