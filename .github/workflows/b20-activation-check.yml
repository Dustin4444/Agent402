name: B20 activation check

# On-demand read of the Base Activation Registry: is the B20 feature set
# live on mainnet yet? Pure eth_call, no keys, no writes. Runs from a
# trigger-file bump on the dev branch (pre-merge) or workflow_dispatch
# (once this file is on main). Feature ids are keccak256 of the feature
# strings — recompute anytime with POST /api/b20-feature-id.
on:
  workflow_dispatch:
  push:
    branches: ["claude/sweet-brown-i99jl3"]
    paths: [".github/trigger-b20check"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: isActivated() for both B20 features on the Activation Registry
        run: |
          REGISTRY="0x8453000000000000000000000000000000000001"
          declare -A FEATURES=(
            ["base.b20_asset"]="0xba87af80cdcc772fe4cbdb1029f822861176d09e646db96723d4c1e82ddfdeb8163ef54c"
            ["base.b20_stablecoin"]="0xba87af80ecfa0def2c10020caaf65e6155aa69c84b24892aaef76eeac52e0e2b3a0b8601"
          )
          RPCS="https://mainnet.base.org https://base-rpc.publicnode.com https://base.llamarpc.com"
          FAILED=0
          for FEATURE in "${!FEATURES[@]}"; do
            DATA="${FEATURES[$FEATURE]}"
            RESULT=""
            for RPC in $RPCS; do
              OUT=$(curl -s --max-time 15 "$RPC" -H 'Content-Type: application/json' \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"$REGISTRY\",\"data\":\"$DATA\"},\"latest\"]}") || true
              RESULT=$(echo "$OUT" | jq -r '.result // empty')
              [ -n "$RESULT" ] && { echo "  ($FEATURE answered by $RPC)"; break; }
              ERR=$(echo "$OUT" | jq -r '.error.message // empty' 2>/dev/null)
              [ -n "$ERR" ] && echo "  ($RPC error: $ERR)"
            done
            case "$RESULT" in
              "") echo "VERDICT $FEATURE: UNKNOWN — no RPC reachable"; FAILED=1;;
              *1) echo "VERDICT $FEATURE: ACTIVATED on the registry";;
              *0) echo "VERDICT $FEATURE: NOT yet activated";;
              *)  echo "VERDICT $FEATURE: unexpected result $RESULT"; FAILED=1;;
            esac
          done
          exit $FAILED

  # TEMPORARY piggyback (reverted after one dispatch): OpenRouter TTS model-id
  # probe — see openrouter-tts-probe.yml, which becomes dispatchable once it
  # reaches the default branch.
  openrouter-tts-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TTS docs page + audio model pricing
        run: |
          echo "=== /docs TTS page model ids ==="
          curl -sSL --max-time 30 "https://openrouter.ai/docs/guides/overview/multimodal/tts" -o /tmp/tts-docs.html || echo "(docs fetch failed)"
          grep -oE '"[a-z0-9-]+/[a-z0-9.+-]+"' /tmp/tts-docs.html | grep -iE 'tts|audio|voxtral|chirp|gemini|gpt' | sort -u | head -30 || true
          grep -oE '[a-z0-9-]+/[a-z0-9.+-]*(tts|audio)[a-z0-9.+-]*' /tmp/tts-docs.html | sort -u | head -30 || true
          echo "=== announcement page ==="
          curl -sSL --max-time 30 "https://openrouter.ai/blog/announcements/announcing-audio-apis/" -o /tmp/ann.html || true
          grep -oE '[a-z0-9-]+/[a-z0-9.+-]*(tts|audio|voxtral|chirp)[a-z0-9.+-]*' /tmp/ann.html | sort -u | head -30 || true
          echo "=== pricing of audio chat models ==="
          curl -sS --max-time 30 https://openrouter.ai/api/v1/models -o /tmp/models.json
          jq -r '.data[] | select(.id | test("audio|tts|voxtral";"i")) | {id, pricing}' /tmp/models.json
