name: Canary burner refill

# Auto top-up for the paid canary's Base burner, from the dedicated refill
# wallet (key: CANARY_REFILL_KEY, Actions secret only — never Railway).
#
# Runs daily two hours BEFORE the paid canary (13:17 UTC), so the burner is
# always funded before it spends. No-ops when the burner is above the floor;
# opens ONE "fund me" issue when the refill wallet itself cannot cover a
# top-up — that issue is the owner's only remaining task, roughly quarterly.
#
# Safety: the recipient is a constant inside scripts/canary-refill.js (no
# input or env can redirect funds), each run sends at most
# REFILL_MAX_PER_RUN_USD, and unreadable balances refuse to send. Decision
# logic pinned by scripts/test-canary-refill.js in CI.

on:
  schedule:
    - cron: "17 11 * * *" # daily ~11:17 UTC — two hours before the paid canary
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install viem only
        run: npm install --no-save --ignore-scripts viem@2.52.2
      - name: Top up the burner if it is under the floor
        id: refill
        env:
          CANARY_REFILL_KEY: ${{ secrets.CANARY_REFILL_KEY }}
          REFILL_FLOOR_USD: ${{ vars.REFILL_FLOOR_USD || 8 }}
          REFILL_TARGET_USD: ${{ vars.REFILL_TARGET_USD || 15 }}
          REFILL_MAX_PER_RUN_USD: ${{ vars.REFILL_MAX_PER_RUN_USD || 12 }}
        run: |
          if node scripts/canary-refill.js; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            CODE=$?
            if [ "$CODE" = "3" ]; then echo "result=empty" >> "$GITHUB_OUTPUT"; else echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1; fi
          fi
      - name: Open or close the fund-me issue
        if: always()
        continue-on-error: true
        run: |
          TITLE="Canary refill wallet needs funding"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "${{ steps.refill.outputs.result }}" = "empty" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The refill wallet (0xeB005745aEB2179b7b6E5506CAf5da4b42e90f8A) cannot cover the next burner top-up. Send USDC on Base (a \$50 top-up is roughly a month of canary runway at ~\$1.50/day) plus a little ETH for gas (~\$1). The refill job runs daily at 11:17 UTC and resumes automatically once funded; a successful run closes this issue. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still unfunded at $(date -u +%FT%TZ)."
            fi
          elif [ "${{ steps.refill.outputs.result }}" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Funded and operating again at $(date -u +%FT%TZ)."
          fi
