services:
  tollbooth:
    build: .
    ports:
      - "4021:4021"
    environment:
      # Where allowed (human / paid) requests are proxied:
      TOLLBOOTH_UPSTREAM: "https://your-origin.example.com"
      # REQUIRED — any long random string; signs proof-of-work tokens:
      # Required. No default and no placeholder on purpose: a shipped
      # placeholder is a published secret, and anyone holding it can forge a
      # zero-difficulty proof-of-work token and bypass the gate for free.
      # Generate one with: openssl rand -hex 32
      TOLLBOOTH_SECRET: ${TOLLBOOTH_SECRET:?set TOLLBOOTH_SECRET - generate with: openssl rand -hex 32}
      # Optional — advertise a USDC x402 quote:
      TOLLBOOTH_PAYTO: "0xYourWallet"
      TOLLBOOTH_PRICE: "$0.001"
      # Optional — stop relying on UA detection (see the tollbooth README):
      # TOLLBOOTH_MODE: "strict"
      # TOLLBOOTH_ADAPTIVE: "true"
    restart: unless-stopped
