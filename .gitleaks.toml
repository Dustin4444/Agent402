# gitleaks config for Agent402. Extends the default ruleset (which catches
# real high-signal secrets: OpenAI sk- keys, GitHub tokens, AWS keys, private
# keys, mnemonics, etc.) plus a contextual EVM-private-key rule below, and
# allowlists the structural false positives this repo carries by design, so CI
# stays green until a GENUINELY new secret lands.
#
# Coverage: secret-scan.yml now scans FULL GIT HISTORY (`--log-opts=--all`,
# fetch-depth 0), not just the working tree. A redacted full-history scan
# (2026-07-18, 1114 commits) found exactly one pre-existing hit — the tracked
# R-01 incident in .remember/ (see the allowlist note below). Every other
# allowlisted pattern is a public on-chain address, the standard demo JWT, or a
# fake test/canary fixture. Real live secrets live only in Railway env and
# GitHub Actions secrets, never in the repo. NOTE: history scanning cannot cover
# GitHub Actions job logs or unreachable workflow commits — those need separate
# incident review (that is how the R-02 burner key was exposed).
[extend]
useDefault = true

# Contextual EVM private key (audit R-08). A raw 0x+64-hex string is ambiguous:
# it is ALSO the shape of a transaction hash and a 32-byte nonce, both of which
# appear all over this repo's tests and receipts. So match 64 hex ONLY when it
# sits next to key-ish context (private/burner/priv/secret key, or a bare `pk`),
# which is what an actually-committed key looks like (BURNER_KEY=0x…, pk="0x…").
# This catches the R-02 class without flooding on hashes/nonces.
[[rules]]
id = "evm-private-key-contextual"
description = "EVM private key adjacent to key-ish context (not a bare tx hash/nonce)"
regex = '''(?i)(private[_-]?key|burner[_-]?key|priv[_-]?key|secret[_-]?key|\bpk\b)['"` \t]{0,4}[:=]['"` \t]{0,4}(0x)?[0-9a-fA-F]{64}\b'''
keywords = ["private", "burner", "privkey", "secretkey", "pk"]

[allowlist]
description = "Agent402 known false positives: on-chain addresses, demo JWTs, test fixtures"
# F08: the broad `docs/.*` and `scripts/test-.*\.js` path excludes are REMOVED —
# they would hide a real credential pasted into a doc or test fixture. Instead
# each intentional fake/public value is allowlisted EXACTLY (regexes/stopwords
# below), so those paths are now fully scanned and a genuinely new secret there
# fails the job. Only two narrow paths remain excluded, for structural reasons:
#   - package-lock.json: npm integrity `sha512-…` hashes look like base64 secrets
#     to the entropy rules but are not secrets.
#   - .gitleaks.toml: this file literally contains the demo JWT + secret-shaped
#     patterns it allowlists; scanning it would flag its own allowlist entries.
paths = [
  '''package-lock\.json''',
  '''\.gitleaks\.toml''',
]
# TRACKED INCIDENT R-01 (not a false positive): a now-ROTATED (dead) Stellar
# facilitator bearer credential sits in the gitignored .remember/ scratch dir in
# history at commit 70fcc5171d8b1d4d8170933db665974f1ce91bbf. Scanning cannot
# un-expose it and the value is dead; we allowlist that EXACT historical commit
# (not the whole path — .remember is gitignored, so no NEW content can land, and
# scoping to the commit keeps every other path/commit scanned). Remove after a
# history purge.
commits = [
  '''70fcc5171d8b1d4d8170933db665974f1ce91bbf''',
]
# Matched against each finding's captured secret.
regexes = [
  # EVM contract/wallet addresses are public identifiers, never secrets. This
  # is 40 hex chars precisely; a real EVM private key is 64 hex and is NOT
  # covered here, so it would still fire.
  '''0x[0-9a-fA-F]{40}\b''',
  # The leak-guard test's own canary tokens (e.g. fredv2-LEAKCANARY0000).
  '''LEAKCANARY''',
  # Placeholder KDF-output example in the crypto-hash tool docs.
  '''a1b2c3d4e5f6''',
]
# The standard demo JWT ({"alg":"HS256","typ":"JWT"} header) used as the
# decode-jwt tool's worked example in kit.js / kit2.js / skills.js. Stopwords
# match when the secret contains the substring.
stopwords = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
]
