[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand on purpose (security audit A402-01): a startCommand overrides
# the Docker ENTRYPOINT, which would bypass docker-entrypoint.sh (the root->node
# privilege drop that chowns the /data volume). The Dockerfile's ENTRYPOINT
# ["docker-entrypoint.sh"] + CMD ["node","src/server.js"] now drive startup, so
# the server runs non-root. (Behaviourally identical to the old startCommand for
# the plain-CMD image, verified on a Railway preview 2026-07-18.)
# Old and new deployments serve concurrently for this long before the old one
# is drained. Railway's default is 0, which means a request can arrive at a
# container that is already going away - the residual cause of the deploy blips
# that turned /status amber on an otherwise healthy service. Pairs with
# RAILWAY_DEPLOYMENT_DRAINING_SECONDS=90, which the deploy job sets.
overlapSeconds = 20
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# State (memory/pow/stats SQLite on the volume) assumes a single writer.
# Do not scale replicas without moving state to a server database first.
numReplicas = 1
