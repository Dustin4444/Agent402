[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand on purpose (security audit A402-01): a startCommand overrides
# the Docker ENTRYPOINT, which would bypass docker-entrypoint.sh (the root->node
# privilege drop that chowns the /data volume). The Dockerfile's ENTRYPOINT
# ["docker-entrypoint.sh"] + CMD ["node","src/server.js"] now drive startup, so
# the server runs non-root. (Behaviourally identical to the old startCommand for
# the plain-CMD image, verified on a Railway preview 2026-07-18.)
# INERT while this service has a volume: Railway cannot run two deployments of
# a volume-backed service at once, so there is never an overlap to configure
# (verified 2026-08-25 from both containers' logs: the old one is stopped, THEN
# the new one starts). Kept so it takes effect the day state moves off the
# volume; until then every deploy has a ~60-90s window with no container
# serving, and nothing in this file or the server can remove it.
overlapSeconds = 20
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# State (memory/pow/stats SQLite on the volume) assumes a single writer.
# Do not scale replicas without moving state to a server database first.
# MCP tasks add a second reason: a task's RECORD is on the volume but its RUN is
# in one process, so a poll that lands on another replica cannot see it, and the
# boot sweep that resolves orphans would mark a live peer's task failed. Scaling
# needs sticky routing (the spec's Mcp-Name header) or a shared run registry.
numReplicas = 1
