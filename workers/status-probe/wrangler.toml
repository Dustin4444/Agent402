name = "agent402-status-probe"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Every 5 minutes. The /status staleness threshold for these components is 45
# minutes, so this tolerates eight consecutive misses before the page reports
# "unknown" — and unlike the GitHub schedule, Cloudflare actually honours it.
[triggers]
crons = ["*/5 * * * *"]

[vars]
PROD = "https://agent402.tools"

# OPERATOR_TOKEN is a Worker SECRET, never a plaintext var. It must equal
# AGENT402_OPERATOR_TOKEN on Railway (the same value /api/status/probe checks):
#   wrangler secret put OPERATOR_TOKEN

# GITHUB_DISPATCH_TOKEN is a Worker SECRET that lets this cron kick
# heartbeat.yml when GitHub has not run it lately:
#   wrangler secret put GITHUB_DISPATCH_TOKEN
#
# WHY: heartbeat.yml carries eighteen alarm checks - every wallet balance,
# Postgres reachability, settlement freshness, the PayAI and CDP quota watches -
# and is their only observer. GitHub does not deliver its schedule. Measured
# 2026-08-30: "*/15" produced gaps of 2-12 hours, and a gentler "9,39" produced
# ONE run in 9.8 hours. This Worker's 5-minute cron IS honoured.
#
# SCOPE IT TIGHTLY. A fine-grained PAT, this repository only, with:
#   Repository permissions -> Actions: Read and write
# and nothing else. It cannot read code, secrets, or any other repo. Without the
# secret the kick is an env-gated no-op and the probe behaves exactly as before.
#
# HEARTBEAT_MAX_AGE_MIN (default 20) is how stale a run must be before a kick.
